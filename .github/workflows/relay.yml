name: Relay files to Bale and Rubika

on:
  repository_dispatch:
    types: [relay-file]
  workflow_dispatch:
    inputs:
      fileId:
        description: "Telegram file_id to relay"
        required: true
      fileName:
        description: "File name"
        required: false
        default: "test-file"
      size:
        description: "File size in bytes (optional)"
        required: false
      asVideo:
        description: "Send as video? (true/false)"
        required: false
        default: "false"
      caption:
        description: "Caption (optional)"
        required: false
      chatId:
        description: "Chat ID (for MTProto lookup)"
        required: false
      messageId:
        description: "Message ID (for MTProto lookup)"
        required: false

concurrency:
  group: bale-link-bot-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run relay
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_API_URL: "https://tapi.bale.ai"
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_API_URL: "https://botapi.rubika.ir"
          RUBIKA_CHANNEL_ID: ${{ secrets.RUBIKA_CHANNEL_ID }}
        run: node src/relay.js

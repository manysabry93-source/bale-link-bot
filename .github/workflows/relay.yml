name: Relay files to Bale and Rubika

on:
  repository_dispatch:
    types: [relay-file]
  workflow_dispatch:
    inputs:
      fileId:
        description: "Telegram file_id to relay"
        required: true
      fileName:
        description: "File name"
        required: false
        default: "test-file"
      size:
        description: "File size in bytes (optional)"
        required: false
      asVideo:
        description: "Send as video? (true/false)"
        required: false
        default: "false"
      caption:
        description: "Caption (optional)"
        required: false

concurrency:
  group: bale-link-bot-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_LOCAL: "true"
        ports:
          - 8081:8081

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Login bot to Local Bot API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "Waiting for Local Bot API..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/bot${TELEGRAM_BOT_TOKEN}/getMe)
            if [ "$STATUS" = "200" ]; then
              echo "Ready!"
              break
            fi
            echo "Attempt $i: HTTP $STATUS, waiting 2s..."
            sleep 2
          done

          echo "Logging out from official Telegram API first..."
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/logOut"
          sleep 3

          echo "Logging in to Local Bot API..."
          RESPONSE=$(curl -s "http://localhost:8081/bot${TELEGRAM_BOT_TOKEN}/getMe")
          echo "Login response: $RESPONSE"
          sleep 5

      - name: Run relay
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          LOCAL_BOT_API_URL: "http://localhost:8081"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_API_URL: "https://tapi.bale.ai"
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_API_URL: "https://botapi.rubika.ir"
          RUBIKA_CHANNEL_ID: ${{ secrets.RUBIKA_CHANNEL_ID }}
        run: node src/relay.js

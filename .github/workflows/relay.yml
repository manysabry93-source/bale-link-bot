name: Relay files to Bale and Rubika

on:
  repository_dispatch:
    types: [relay-file]
  workflow_dispatch:
    inputs:
      fileId:
        description: "Telegram file_id to relay"
        required: true
      fileName:
        description: "File name"
        required: false
        default: "test-file"
      size:
        description: "File size in bytes (optional)"
        required: false
      asVideo:
        description: "Send as video? (true/false)"
        required: false
        default: "false"
      caption:
        description: "Caption (optional)"
        required: false

concurrency:
  group: bale-link-bot-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Check env vars
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHANNEL_ID: ${{ secrets.RUBIKA_CHANNEL_ID }}
        run: |
          echo "TELEGRAM_BOT_TOKEN set: $([[ -n "$TELEGRAM_BOT_TOKEN" ]] && echo YES || echo NO)"
          echo "BALE_BOT_TOKEN set: $([[ -n "$BALE_BOT_TOKEN" ]] && echo YES || echo NO)"
          echo "BALE_CHANNEL_ID set: $([[ -n "$BALE_CHANNEL_ID" ]] && echo YES || echo NO)"
          echo "RUBIKA_BOT_TOKEN set: $([[ -n "$RUBIKA_BOT_TOKEN" ]] && echo YES || echo NO)"
          echo "RUBIKA_CHANNEL_ID set: $([[ -n "$RUBIKA_CHANNEL_ID" ]] && echo YES || echo NO)"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Event payload:"
          cat $GITHUB_EVENT_PATH

      - name: Run relay
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_API_URL: "https://tapi.bale.ai"
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_API_URL: "https://botapi.rubika.ir"
          RUBIKA_CHANNEL_ID: ${{ secrets.RUBIKA_CHANNEL_ID }}
        run: node src/relay.js 2>&1
